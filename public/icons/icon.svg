<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="thrust-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thrust-aux" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f43f5e" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0b0f19"/>

  <!-- Radar Reticle Rings -->
  <circle cx="256" cy="256" r="191.5" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="256" cy="256" r="130.6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="69.6" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Radar Axis Crosshair Ticks -->
  <path d="M256,52 L256,88 M256,424 L256,460 M52,256 L88,256 M424,256 L460,256" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Broadside Crimson Accent Arcs (#f43f5e) -->
  <path d="M 121.1,208.1 A 144.7 144.7 0 0 0 129.8,325.6" fill="none" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" filter="url(#crimson-glow)"/>
  <path d="M 390.9,208.1 A 144.7 144.7 0 0 1 382.2,325.6" fill="none" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" filter="url(#crimson-glow)"/>

  <!-- Thruster Exhaust Plumes (#38bdf8) -->
  <polygon points="241.9,334.3 270.1,334.3 256.0,399.6" fill="url(#thrust-main)"/>
  <polygon points="210.3,349.6 223.4,349.6 216.8,382.2" fill="url(#thrust-aux)"/>
  <polygon points="288.6,349.6 301.7,349.6 295.2,382.2" fill="url(#thrust-aux)"/>

  <!-- Starship Hull Plates -->
  <!-- Main Wing Plates -->
  <polygon points="232.1,190.7 173.3,282.1 177.7,332.2 203.8,351.7 229.9,334.3 249.5,330.0 249.5,242.9 242.9,223.4 249.5,203.8" fill="#e2e8f0"/>
  <polygon points="279.9,190.7 338.7,282.1 334.3,332.2 308.2,351.7 282.1,334.3 262.5,330.0 262.5,242.9 269.1,223.4 262.5,203.8" fill="#cbd5e1"/>

  <!-- Armor Flank Chafers -->
  <polygon points="173.3,282.1 177.7,332.2 203.8,351.7 197.2,338.7 186.4,321.3 184.2,286.5" fill="#94a3b8"/>
  <polygon points="338.7,282.1 334.3,332.2 308.2,351.7 314.8,338.7 325.6,321.3 327.8,286.5" fill="#94a3b8"/>

  <!-- Forward Prow Plates -->
  <polygon points="256.0,108.0 236.4,164.6 223.4,177.7 232.1,190.7 256.0,203.8" fill="#f8fafc"/>
  <polygon points="256.0,108.0 275.6,164.6 288.6,177.7 279.9,190.7 256.0,203.8" fill="#e2e8f0"/>

  <!-- Engine Bulkhead -->
  <polygon points="229.9,334.3 282.1,334.3 273.4,343.0 238.6,343.0" fill="#1e293b"/>

  <!-- Armor Panel Seam Lines -->
  <path d="M 232.1,190.7 L 256.0,203.8 L 279.9,190.7" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 177.7,290.8 L 249.5,282.1" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M 334.3,290.8 L 262.5,282.1" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Central Spine Conduit (#38bdf8) -->
  <path d="M 256.0,182.0 L 256.0,208.1 M 256.0,240.8 L 256.0,321.3" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Bridge Diamond & Glow (#38bdf8 + #e0f2fe) -->
  <polygon points="256.0,208.1 266.9,223.4 256.0,238.6 245.1,223.4" fill="#38bdf8"/>
  <polygon points="256.0,214.7 261.4,223.4 256.0,232.1 250.6,223.4" fill="#e0f2fe"/>
